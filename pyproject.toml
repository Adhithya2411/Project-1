[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahrag"
version = "0.3.0"
description = "AHRAG — a governance-aware adaptive router for enterprise RAG (research prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Kept in sync with requirements.txt. Optional upgrades live in the
# [project.optional-dependencies] table below and in requirements-optional.txt.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "streamlit>=1.32",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# None of these are required; each has a deterministic offline fallback.
neural = ["sentence-transformers>=2.7"]
chroma = ["chromadb>=0.5"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
ahrag-api = "ahrag.api.app:main"

[tool.setuptools.packages.find]
include = ["ahrag*"]

[tool.setuptools.package-data]
ahrag = ["seed/*.yaml", "seed/corpus/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
