# ==============================================================================
# AHRAG labelled evaluation suite.
#
# 32 items across the strata the research draft names: exact lookup, semantic
# lookup, procedural, comparison, multi-hop, temporal/freshness, unanswerable,
# and permission-constrained.
#
# HOW THE LABELS WERE MADE — this matters for reading the results honestly:
#
#   * gold_chunks were assigned by reading the seeded corpus and identifying the
#     passages that actually contain the answer. They were NOT produced by
#     running any retriever, so they do not favour sparse, dense, or hybrid.
#   * expected_route is a *hypothesis* about which route should win, used only
#     for the route-agreement diagnostic. It is NOT used to score any retrieval
#     or answer metric, and no system is rewarded for matching it.
#   * should_abstain marks items where the correct behaviour is refusal:
#     either the user lacks authorisation, or the corpus does not contain the
#     answer at all.
#   * freshness_sensitive marks items where a superseded source would be a wrong
#     answer even though it is topically relevant.
#
# The suite is small and single-annotator. It is a functional regression suite
# for this prototype, not a benchmark, and it cannot support claims about
# general performance. See RESEARCH_LIMITATIONS.md.
# ==============================================================================

