# ==============================================================================
# Seeded demo corpus manifest.
#
# Everything AHRAG's governance layer needs that cannot be inferred from a file:
# ownership, ACL roles, effective dates, versions, authority, and the
# supersedes/superseded-by chain. Ingesting a file *without* a manifest entry is
# allowed (see the UI upload panel) but the document then defaults to the most
# restrictive sensible ACL, never to "everyone".
#
# authority_score: 1 = informal note, 3 = working document, 5 = ratified policy.
# ==============================================================================

roles:
  employee:   "Baseline role held by every member of staff."
  manager:    "Line manager; may read management-scoped material."
  engineering: "Engineering staff; may read runbooks and platform plans."
  hr:         "HR function; may read all HR policy material including drafts."
  finance:    "Finance function; may read restricted financial material."

users:
  - user_id: alice.employee
    display_name: "Alice Nowak — Support Engineer"
    roles: [employee, engineering]
    description: "General staff with engineering access. No finance, no HR-internal."
  - user_id: bob.manager
    display_name: "Bob Adeyemi — Delivery Manager"
    roles: [employee, manager]
    description: "Line manager. Reads reports and policies; no finance, no runbooks."
  - user_id: carol.hr
    display_name: "Carol Bianchi — HR Business Partner"
    roles: [employee, hr, manager]
    description: "HR function. Full HR policy access including superseded versions."
  - user_id: dan.finance
    display_name: "Dan Oyelaran — Finance Analyst"
    roles: [employee, finance]
    description: "Finance function. The only role that may read restricted finance."
  - user_id: erin.contractor
    display_name: "Erin Vasquez — External Contractor"
    roles: [employee]
    description: "Baseline access only. Used to demonstrate scope restriction."

documents:
  - doc_id: doc-hr-leave-v2
    path: corpus/hr_leave_policy_v2.md
    title: "Annual Leave and Time-Off Policy"
    doc_type: policy
    owner: "HR Director"
    acl_roles: [employee, manager, hr]
    created_date: 2024-11-18
    effective_date: 2025-01-01
    version: "2.1"
    authority_score: 5
    policy_family: leave-policy
    supersedes: doc-hr-leave-v1

  - doc_id: doc-hr-leave-v1
    path: corpus/hr_leave_policy_v1.md
    title: "Annual Leave and Time-Off Policy (2023 edition)"
    doc_type: policy
    owner: "HR Director"
    acl_roles: [employee, manager, hr]
    created_date: 2022-12-02
    effective_date: 2023-01-01
    version: "1.4"
    authority_score: 4
    policy_family: leave-policy
    # superseded_by is derived from the `supersedes` link above at ingest time.

